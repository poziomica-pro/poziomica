<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F1215">
<title>Poziomica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0F1215; --card:#1A1F24; --deep:#12161A; --line:#2A3138; --line2:#232A31; --edge:#3A434C;
  --text:#EEF1F3; --soft:#C9D1D8; --muted:#9AA4AD; --faint:#6E7881;
  --accent:#F2C230; --onaccent:#1A1400; --ok:#34D399; --onok:#06281B; --warn:#F59E0B; --bad:#F87171;
  --ycol:#7FB2FF; --tcol:#F0A3FF;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --sans:'IBM Plex Sans',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.38;cursor:default}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px);display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h1{font-size:22px;font-weight:700}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.lab{font-size:13px;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono)}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.band{display:flex;align-items:center;justify-content:space-between;border-radius:14px;padding:12px 16px}
.band .big{font-size:20px;font-weight:700;letter-spacing:1px}
.band small{font-size:12px;text-align:right;line-height:1.35;font-weight:500}
.ready{background:var(--ok);color:var(--onok)}
.wait{background:transparent;color:var(--warn);border:2px solid var(--warn)}
.off{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.val{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.5px}
.btn{height:52px;border-radius:14px;font-size:15px;font-weight:600;background:var(--card);color:var(--text);border:1px solid var(--edge)}
.btn.pri{background:var(--accent);color:var(--onaccent);border:0;font-size:16px;font-weight:700}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.sm{height:40px;padding:0 12px;border-radius:10px;font-size:13px;background:transparent}
.btn.acc{color:var(--accent);border-color:var(--accent)}
.seg{display:grid;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{height:40px;border-radius:9px;border:0;background:transparent;color:var(--soft);font-size:14px}
.seg button.on{background:var(--accent);color:var(--onaccent);font-weight:700}
.list{padding:4px 14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .t{font-size:15px;font-weight:600}
.li .d{font-size:12px;color:var(--muted)}
.tbl{padding:2px 14px;font-size:13px}
.tr{display:grid;grid-template-columns:30px repeat(4,minmax(0,1fr));gap:4px;padding:8px 0;border-bottom:1px solid var(--line2);font-family:var(--mono)}
.tr:last-child{border-bottom:0}
.tr.hd{color:var(--muted);font-size:11px;font-weight:600;font-family:var(--sans);border-bottom:1px solid var(--line)}
.tr .n{font-family:var(--sans);font-weight:600}
.dim{color:var(--muted)}
.badd{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px 0 calc(env(safe-area-inset-bottom) + 10px)}
nav button{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px}
nav button.on{color:var(--accent);font-weight:600}
.cap{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:448px;margin:0 auto;background:#2A3138;color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:30}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}
.steps span.done{background:var(--ok)}
input[type=number]{width:100%;height:44px;border-radius:10px;border:1px solid var(--edge);background:var(--deep);color:var(--text);font-family:var(--mono);font-size:16px;padding:0 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>

<script id="core">
// ===== logika serii i formatowanie (bez Bluetooth i ekranu) =====
const DRIFT_LIMIT = 0.010, DIFF_LIMIT = 0.010;

function parseP(line) {             // P,nr,t,x,y,temp,stab,kier
  const a = line.split(',');
  if (a.length < 7) return null;
  return { idx: +a[1], t: +a[2], x: +a[3], y: +a[4], temp: +a[5], stab: +a[6], dir: a[7] || 'T' };
}
function parseS(line) {             // S,t,x,y,temp,gotowe,niep,V,okno,powrot,nast,ntam,karta,koniec
  const a = line.split(',');
  return { t: +a[1], x: +a[2], y: +a[3], temp: +a[4], stable: a[5] === '1', spread: +a[6], volt: +a[7],
           win: +a[8], ret: a[9] === '1', next: +a[10], nTam: +a[11], sd: +a[12], done: a[13] === '1' };
}
function parseI(line) {             // I,fw,zx,zy,kx,ky,zt,ktx,kty,dzwiek,karta,plik,okno,krok_um
  const a = line.split(',');
  return { res: +a[13] || 5, fw: a[1], zx: +a[2], zy: +a[3], kx: +a[4], ky: +a[5], zt: +a[6], ktx: +a[7], kty: +a[8],
           sound: a[9] === '1', sd: +a[10], file: a[11], win: +a[12] };
}

// wynik serii z listy punktow
function analyze(points) {
  const T = [], W = [];
  let E = null;
  for (const p of points) {
    if (p.dir === 'T') T[p.idx] = p; else if (p.dir === 'W') W[p.idx] = p; else if (p.dir === 'E') E = p;
  }
  const nT = T.length;
  const res = { mode: 'open', rows: [], drift: null, maxDiff: null, done: false, ok: null, nT };
  if (!nT || !T[0]) return res;
  const t0 = T[0];
  const hasW = W.some(Boolean);
  const ax = ['x', 'y'];
  if (hasW) {
    res.mode = 'bidir';
    const w0 = W[0];
    res.done = !!w0;
    const drift = w0 ? { x: w0.x - t0.x, y: w0.y - t0.y } : null;
    const span = w0 ? w0.t - t0.t : 0;
    res.drift = drift;
    const maxD = { x: 0, y: 0 };
    for (let i = 0; i < nT; i++) {
      const a = T[i]; if (!a) continue;
      const turn = i === nT - 1;
      const b = W[i] || (turn ? a : null);
      const r = { idx: i, temp: a.temp, tamT: a.t, turn };
      for (const k of ax) {
        r['tam' + k] = a[k] - t0[k];
        r['pow' + k] = b && !turn ? b[k] - t0[k] : null;
        r['sr' + k] = b && w0 ? (a[k] + b[k]) / 2 - (t0[k] + w0[k]) / 2 : null;
        if (b && w0 && !turn) {
          const f = span > 0 ? (b.t - a.t) / span : 0;
          r['r' + k] = (b[k] - a[k]) - f * drift[k];
          maxD[k] = Math.max(maxD[k], Math.abs(r['r' + k]));
        } else r['r' + k] = null;
      }
      if (b && !turn) r.tempW = b.temp;
      res.rows.push(r);
    }
    if (res.done) {
      res.maxDiff = maxD;
      res.ok = Math.abs(drift.x) <= DRIFT_LIMIT && Math.abs(drift.y) <= DRIFT_LIMIT &&
               maxD.x <= DIFF_LIMIT && maxD.y <= DIFF_LIMIT;
    }
    return res;
  }
  res.mode = E ? 'oneway' : 'open';
  res.done = !!E;
  const drift = E ? { x: E.x - t0.x, y: E.y - t0.y } : null;
  const span = E ? E.t - t0.t : 0;
  res.drift = drift;
  for (let i = 0; i < nT; i++) {
    const a = T[i]; if (!a) continue;
    const r = { idx: i, temp: a.temp, tamT: a.t, turn: false };
    const f = E && span > 0 ? (a.t - t0.t) / span : 0;
    for (const k of ax) {
      r['tam' + k] = a[k] - t0[k];
      r['pow' + k] = null;
      r['sr' + k] = E ? (a[k] - t0[k]) - f * drift[k] : null;
      r['r' + k] = null;
    }
    res.rows.push(r);
  }
  if (E) res.ok = Math.abs(drift.x) <= DRIFT_LIMIT && Math.abs(drift.y) <= DRIFT_LIMIT;
  return res;
}

// kalibracja zera A-B-A: A1, B (po obrocie 180 st.), A2 - odczyty {t,x,y}
function calcABA(a1, b, a2) {
  const f = a2.t !== a1.t ? (b.t - a1.t) / (a2.t - a1.t) : 0.5;
  const ai = { x: a1.x + (a2.x - a1.x) * f, y: a1.y + (a2.y - a1.y) * f };
  return {
    zero: { x: (ai.x + b.x) / 2, y: (ai.y + b.y) / 2 },
    tilt: { x: (ai.x - b.x) / 2, y: (ai.y - b.y) / 2 },
    drift: { x: a2.x - a1.x, y: a2.y - a1.y }
  };
}

// kalibracja czulosci: h [mm] pod jednym koncem, L [mm] rozstaw podparc
function calcSens(a1, b, a2, axis, h, L, kOld) {
  const f = a2.t !== a1.t ? (b.t - a1.t) / (a2.t - a1.t) : 0.5;
  const ai = a1[axis] + (a2[axis] - a1[axis]) * f;
  const measured = Math.abs(b[axis] - ai);
  const expected = Math.asin(h / L) * 1000;
  const kNew = measured > 0 ? kOld * expected / measured : NaN;
  return { measured, expected, kNew, drift: a2[axis] - a1[axis], ok: kNew > 0.8 && kNew < 1.2 };
}

// jednostki
// krok wyswietlania 0,005 mm/m (= 5 µm/m, ok. 1″) - mniejsze roznice to szum czujnika
const UNITS = { mmm: { f: 1, d: 3, l: 'mm/m' }, umm: { f: 1000, d: 0, l: 'µm/m' }, sec: { f: 206.265, d: 0, l: '″' } };
let RES = 0.005;                    // krok wyswietlania w mm/m: 0,005 albo 0,001
function unitStep(unit) { const u = UNITS[unit] || UNITS.mmm; return unit === 'sec' ? (RES >= 0.005 ? 1 : 0.2) : RES * u.f; }
function unitDec(unit) { return unit === 'sec' ? (RES >= 0.005 ? 0 : 1) : (UNITS[unit] || UNITS.mmm).d; }
// histereza: nowa wartosc dopiero gdy odczyt odejdzie o 0,7 kroku od pokazywanej
const shown = {};
function hyst(key, v) {
  const p = shown[key];
  if (!p || p.res !== RES || Math.abs(v - p.v) > 0.7 * RES) shown[key] = { v: Math.round(v / RES) * RES, res: RES };
  return shown[key].v;
}
function fmt(v, unit, sign = true) {
  if (v === null || v === undefined || isNaN(v)) return '–';
  const u = UNITS[unit] || UNITS.mmm;
  const step = unitStep(unit);
  const r = Math.round(v * u.f / step) * step;
  let s = Math.abs(r).toFixed(unitDec(unit)).replace('.', ',');
  if (!/[1-9]/.test(s)) return s;                  // po zaokragleniu zero: bez znaku
  if (!sign) return (v < 0 ? '−' : '') + s;
  return (v < 0 ? '−' : '+') + s;
}
function niceScale(m, steps) {
  for (const s of steps) if (m <= s) return s;
  return steps[steps.length - 1];
}

// CSV serii
function seriesCsv(res, points) {
  const L = ['# Poziomica - seria (' + (res.mode === 'bidir' ? 'tam i z powrotem' : 'w jedna strone') + '), mm/m'];
  if (res.drift) L.push('# dryft (powrot na start) X ' + res.drift.x.toFixed(4) + ' Y ' + res.drift.y.toFixed(4));
  L.push('nr;tam_x;tam_y;powrot_x;powrot_y;srednia_x;srednia_y;roznica_x;roznica_y;temp_C');
  const n = v => v === null || v === undefined ? '' : v.toFixed(4).replace('.', ',');
  for (const r of res.rows)
    L.push(['P' + r.idx, n(r.tamx), n(r.tamy), n(r.powx), n(r.powy), n(r.srx), n(r.sry), n(r.rx), n(r.ry),
            isNaN(r.temp) ? '' : r.temp.toFixed(2).replace('.', ',')].join(';'));
  L.push('');
  L.push('# surowe punkty: nr;kier;t_s;x;y;temp;niepewnosc');
  for (const p of points) L.push(['P' + p.idx, p.dir, p.t, n(p.x), n(p.y), n(p.temp), n(p.stab)].join(';'));
  return L.join('\r\n') + '\r\n';
}
if (typeof module !== 'undefined') module.exports = { hyst, setRes: v => { RES = v; }, parseP, parseS, parseI, analyze, calcABA, calcSens, fmt, seriesCsv, niceScale };
</script>

<script>
const APP_VERSION = '04.4';
const FW_MIN = '04.4';             // wersja programu poziomicy, z ktora ta aplikacja dziala w pelni
// ===== Bluetooth (Nordic UART) =====
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

const st = {
  dev: null, rx: null, connected: false, connecting: false,
  s: null, info: null, points: [], tempHist: [],
  tab: 'pomiar', unit: 'mmm', axis: 'x', showT: true,
  buf: '', dl: null, qWait: null, toastTimer: null
};
try { st.unit = localStorage.getItem('poz_unit') || 'mmm'; RES = localStorage.getItem('poz_res') === '0.001' ? 0.001 : 0.005; } catch (e) {}

let writeChain = Promise.resolve();
function send(cmd) {
  if (!st.rx) return Promise.resolve();
  const data = new TextEncoder().encode(cmd);
  writeChain = writeChain.then(async () => {
    for (let i = 0; i < data.length; i += 20) await st.rx.writeValue(data.slice(i, i + 20));
  }).catch(e => toast('Błąd wysyłania: ' + e.message));
  return writeChain;
}

async function setupGatt(dev) {
  const server = await dev.gatt.connect();
  const svc = await server.getPrimaryService(NUS);
  st.rx = await svc.getCharacteristic(NUS_RX);
  const tx = await svc.getCharacteristic(NUS_TX);
  tx.addEventListener('characteristicvaluechanged', ev => onData(new TextDecoder().decode(ev.target.value)));
  await tx.startNotifications();
  st.connected = true; st.points = []; st.buf = ''; st.dl = null;
  writeChain = Promise.resolve();
  await send(RES === 0.001 ? 'H' : 'G'); await send('i'); await send('L');
  wakeOn();
}

async function connect() {
  if (!navigator.bluetooth) { toast('Ta przeglądarka nie obsługuje Bluetooth. Otwórz stronę w aplikacji Bluefy.'); return; }
  try {
    st.connecting = true; st.userDisc = false; render();
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ name: 'Poziomica' }, { services: [NUS] }], optionalServices: [NUS] });
    if (st.dev !== dev) dev.addEventListener('gattserverdisconnected', onDisconnect);
    st.dev = dev;
    await setupGatt(dev);
  } catch (e) {
    if (e.name !== 'NotFoundError') toast('Nie udało się połączyć: ' + e.message);
  }
  st.connecting = false; render();
}
function disconnect() { st.userDisc = true; if (st.dev && st.dev.gatt.connected) st.dev.gatt.disconnect(); }

// po zerwaniu polaczenia: sama laczy sie ponownie (bez wybierania z listy)
async function onDisconnect() {
  st.connected = false; st.rx = null; st.s = null; st.dl = null;
  if (st.qWait) { clearTimeout(st.qWait.timer); st.qWait.reject(new Error('rozlaczono')); st.qWait = null; }
  st.drops = (st.drops || 0) + 1;
  if (st.userDisc || !st.dev) { render(); toast('Rozłączono z poziomicą'); return; }
  st.reconnecting = true; render();
  for (let i = 0; i < 8 && !st.userDisc; i++) {
    await new Promise(r => setTimeout(r, i === 0 ? 300 : 1500));
    try { await setupGatt(st.dev); break; } catch (e) { /* kolejna proba */ }
  }
  st.reconnecting = false;
  if (!st.connected && !st.userDisc) toast('Nie udało się połączyć ponownie – naciśnij Połącz');
  render();
}

// ekran telefonu nie gasnie, gdy aplikacja jest polaczona
let wakeLock = null;
async function wakeOn() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && st.connected) wakeOn(); });

function onData(chunk) {
  st.buf += chunk;
  for (;;) {
    if (st.dl) {
      st.dl.data += st.buf; st.buf = '';
      const end = st.dl.data.indexOf('\n#END\n');
      if (end >= 0) {
        const text = st.dl.data.slice(0, end), rest = st.dl.data.slice(end + 6), name = st.dl.name;
        st.dl = null; st.buf = rest;
        saveFile(name, text, 'text/csv'); render();
        continue;
      }
      updateDl(); return;
    }
    const i = st.buf.indexOf('\n');
    if (i < 0) return;
    const line = st.buf.slice(0, i).replace(/\r$/, '');
    st.buf = st.buf.slice(i + 1);
    onLine(line);
  }
}

let lastRender = 0;
function onLine(line) {
  if (!line) return;
  const c = line[0];
  if (line.startsWith('S,')) {
    st.s = parseS(line);
    st.tempHist.push({ t: Date.now(), T: st.s.temp });
    while (st.tempHist.length && Date.now() - st.tempHist[0].t > 20 * 60000) st.tempHist.shift();
    renderLive();
  } else if (line.startsWith('I,')) {
    st.info = parseI(line);
    if (st.info.fw < FW_MIN && !st.fwWarned) { st.fwWarned = true; toast('W poziomicy jest program ' + st.info.fw + ' – wgraj ' + FW_MIN + ', inaczej część funkcji nie zadziała'); }
    render();
  }
  else if (line.startsWith('P,')) {
    const p = parseP(line);
    if (p && !st.points.some(q => q.idx === p.idx && q.dir === p.dir && q.t === p.t)) st.points.push(p);
    render();
  } else if (line.startsWith('Q,')) {
    const w = st.qWait; st.qWait = null;
    if (w) { clearTimeout(w.timer); if (line === 'Q,ERR') w.reject(new Error('niestabilny')); else { const a = line.split(','); w.resolve({ t: +a[1], x: +a[2], y: +a[3], temp: +a[4], stab: +a[5] }); } }
  } else if (line.startsWith('#BEGIN')) {
    const a = line.split(' ');
    st.dl = { name: a[1] || 'plik.csv', size: +a[2] || 0, data: '' };
    updateDl();
  } else if (line.startsWith('# nowa seria') || line.startsWith('# lista punktow')) { st.points = []; render(); }
  else if (line.startsWith('#ERR')) toast({ 'zero': 'Poziomica nie zapisała zera – wgraj program ' + FW_MIN + ' lub nowszy', 'czulosc': 'Poziomica nie zapisała czułości', 'brak karty': 'Brak karty SD w poziomicy', 'brak pliku': 'Brak pliku na karcie' }[line.slice(5)] || line.slice(5));
  else if (line.startsWith('# BT')) { /* informacja diagnostyczna z poziomicy */ }
  else if (c === '#' && /UWAGA|niestabilny|zapisan|skasowan|powrot|za malo|zakonczona/.test(line)) toast(line.slice(2));
}

function reading() {
  return new Promise((resolve, reject) => {
    st.qWait = { resolve, reject, timer: setTimeout(() => { st.qWait = null; reject(new Error('brak odpowiedzi')); }, 4000) };
    send('q');
  });
}

async function saveFile(name, text, type) {
  const blob = new Blob([text], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = '<div class="toast"></div>'; el.firstChild.textContent = msg;
  clearTimeout(st.toastTimer); st.toastTimer = setTimeout(() => { el.innerHTML = ''; }, 3500);
}

function connPill() {
  if (st.reconnecting) return `<div class="pill"><span class="dot" style="background:var(--warn)"></span><span>Łączę ponownie…</span></div>`;
  if (!st.connected) return `<button class="btn sm acc" data-act="connect" ${st.connecting ? 'disabled' : ''}>${st.connecting ? 'Łączę…' : 'Połącz'}</button>`;
  const v = st.s ? num(st.s.volt, 2) + ' V' : '…';
  return `<div class="pill"><span class="dot" style="background:var(--ok)"></span><span>Połączono</span><span style="color:var(--faint)">·</span><span class="mono">${v}</span></div>`;
}

function band() {
  const s = st.s;
  if (st.reconnecting) return `<div class="band wait"><span class="big" style="font-size:17px;letter-spacing:0">Łączę ponownie…</span><small>zerwane połączenie</small></div>`;
  if (!st.connected) return `<div class="band off"><span class="big" style="font-size:17px;letter-spacing:0">Brak połączenia</span><small>naciśnij Połącz</small></div>`;
  if (!s) return `<div class="band off"><span class="big" style="font-size:17px;letter-spacing:0">Czekam na dane…</span></div>`;
  const info = `stabilność ±${s.spread >= 0 ? num(s.spread, 3) : '–'}<br>okno ${s.win} s`;
  return s.stable
    ? `<div class="band ready"><div class="row" style="gap:10px">${ICON.ok}<span class="big">GOTOWE</span></div><small>${info}</small></div>`
    : `<div class="band wait"><span class="big">czekaj</span><small>${info}</small></div>`;
}

function libella() {
  const s = st.s, x = s ? s.x : 0, y = s ? s.y : 0;
  const S = niceScale(Math.max(Math.abs(x), Math.abs(y)) * 1.15, [0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50]);
  const R = 100, cx = 115, cy = 115;
  const clamp = v => Math.max(-1, Math.min(1, v / S));
  const px = cx + clamp(x) * R, py = cy - clamp(y) * R;
  const tol = 0.02 / S * R;
  return `<div class="card" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px">
<svg width="196" height="196" viewBox="0 0 230 230" role="img" aria-label="Libella: przechył X i Y">

<circle cx="115" cy="115" r="${R * 2 / 3}" fill="none" stroke="#2A3138" stroke-width="1.5"/>
<circle cx="115" cy="115" r="${R / 3}" fill="none" stroke="#3A434C" stroke-width="1.5"/>
<line x1="7" y1="115" x2="223" y2="115" stroke="#2A3138" stroke-width="1.5"/><line x1="115" y1="7" x2="115" y2="223" stroke="#2A3138" stroke-width="1.5"/>
${tol >= 4 ? `<circle cx="115" cy="115" r="${tol}" fill="none" stroke="#F2C230" stroke-width="2" stroke-dasharray="3 3"/>` : ''}

}

function tempTrend() {
  const h = st.tempHist;
  if (h.length < 30) return '';
  const now = h[h.length - 1];
  let ref = h[0];
  for (const p of h) if (now.t - p.t <= 10 * 60000) { ref = p; break; }
  const min = Math.max(1, Math.round((now.t - ref.t) / 60000));
  const d = now.T - ref.T;
  return (d < 0 ? '−' : '+') + num(Math.abs(d), 2) + ' / ' + min + ' min';
}

function chart(res) {
  const k = st.axis, rows = res.rows;
  if (!rows.length) return '';
  const vals = [];
  for (const r of rows) { vals.push(r['tam' + k]); if (r['pow' + k] !== null) vals.push(r['pow' + k]); }
  const S = niceScale(Math.max(...vals.map(Math.abs)) * 1.1 || 0.01, [0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50]);
  const x0 = 72, x1 = 308, top = 20, mid = 75, bot = 130;
  const X = i => rows.length > 1 ? x0 + (x1 - x0) * i / (rows.length - 1) : (x0 + x1) / 2;
  const Y = v => mid - v / S * (mid - top);
  let g = `<line x1="50" y1="75" x2="324" y2="75" stroke="#3A434C" stroke-width="1.5"/><line x1="50" y1="20" x2="324" y2="20" stroke="#232A31"/><line x1="50" y1="130" x2="324" y2="130" stroke="#232A31"/>
<text x="46" y="24" fill="#6E7881" font-size="10" text-anchor="end" font-family="IBM Plex Mono">${fmt(S, st.unit)}</text><text x="46" y="79" fill="#6E7881" font-size="10" text-anchor="end" font-family="IBM Plex Mono">0</text><text x="46" y="134" fill="#6E7881" font-size="10" text-anchor="end" font-family="IBM Plex Mono">${fmt(-S, st.unit)}</text>`;
  if (st.showT) {
    const ts = [];
    rows.forEach((r, i) => { if (!isNaN(r.temp)) ts.push([X(i), r.temp]); });
    if (ts.length) {
      // skala temperatury co najmniej 0,5 C na cala wysokosc - drobne wahania nie wygladaja na duze
      const lo0 = Math.min(...ts.map(a => a[1])), hi0 = Math.max(...ts.map(a => a[1]));
      const span = Math.max(hi0 - lo0, 0.5), lo = (lo0 + hi0) / 2 - span / 2;
      const TY = t => bot - (t - lo) / span * (bot - top);
      g += `<polyline points="${ts.map(a => a[0] + ',' + TY(a[1])).join(' ')}" fill="none" stroke="#F0A3FF" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>`;
      g += ts.map(a => `<path d="M${a[0]} ${TY(a[1]) - 5}l5 5-5 5-5-5z" fill="#F0A3FF"/>`).join('');
    }
  }
  g += `<polyline points="${rows.map((r, i) => X(i) + ',' + Y(r['tam' + k])).join(' ')}" fill="none" stroke="#F2C230" stroke-width="2.5"/>`;
  const back = [];
  rows.forEach((r, i) => { if (r.turn) back.push([X(i), Y(r['tam' + k])]); else if (r['pow' + k] !== null) back.push([X(i), Y(r['pow' + k])]); });
  back.sort((a, b) => b[0] - a[0]);
  if (back.length > 1) g += `<polyline points="${back.map(a => a.join(',')).join(' ')}" fill="none" stroke="#F2C230" stroke-width="2" stroke-dasharray="6 4"/>`;
  rows.forEach((r, i) => {
    g += `<circle cx="${X(i)}" cy="${Y(r['tam' + k])}" r="4.5" fill="#F2C230"/>`;
    if (r['pow' + k] !== null) g += `<circle cx="${X(i)}" cy="${Y(r['pow' + k])}" r="4.5" fill="#1A1F24" stroke="#F2C230" stroke-width="2"/>`;
    if (rows.length <= 12 || i % 2 === 0) g += `<text x="${X(i)}" y="147" fill="#9AA4AD" font-size="11" text-anchor="middle" font-family="IBM Plex Mono">P${r.idx}</text>`;
  });
  return `<svg width="100%" viewBox="0 0 330 150" role="img" aria-label="Wykres serii">${g}</svg>`;
}

  const ocena = res.ok === null ? tile('Ocena', '–') : res.ok ? tile('Ocena', 'OK', 'color:var(--ok);font-family:var(--sans);font-weight:700') : tile('Ocena', 'Powtórz', 'color:var(--bad);font-family:var(--sans);font-weight:700');
  const temps = res.rows.map(r => r.temp).filter(t => !isNaN(t));
  const tRange = temps.length ? 'T: ' + num(Math.min(...temps), 2) + '–' + num(Math.max(...temps), 2) + ' °C' : '';

  return `<div class="row" style="align-items:flex-end"><div><div class="h1">${title}</div><div class="sub">${n ? n + ' pkt · ' : ''}${status} · ${UNITS[st.unit].l}</div></div></div>

 ${n ? chart(res) : '<div class="sub" style="padding:30px 0;text-align:center">Zapisz punkty na ekranie Pomiar</div>'}

</div>
${n ? `<div class="card tbl"><div class="tr hd"><span>${k.toUpperCase()}</span><span>tam</span><span>powrót</span><span>średnia</span><span>różnica</span></div>${rows}</div>` : ''}

function dateStr(t) {
  if (!t) return null;
  const d = new Date(t * 1000);
  return d.toLocaleDateString('pl-PL') + ' ' + d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
}

// ===== kreatory kalibracji =====
let wiz = null;
const ABA_STEPS = [
  ['A', 'Postaw poziomicę w pozycji A i obrysuj jej położenie (ołówek, taśma).'],
  ['B', 'Obróć poziomicę o 180° i postaw dokładnie w tym samym miejscu.'],
  ['A', 'Obróć z powrotem do pozycji A, w ten sam obrys.']
];
const SENS_STEPS = [
  ['A', 'Poziomica na płycie bez podkładki.'],
  ['B', 'Podłóż wałek / płytkę wzorcową pod jeden koniec bazy (wzdłuż wybranej osi).'],
  ['A', 'Zdejmij podkładkę, poziomica w tym samym miejscu.']
];
function openWiz(type) {
  wiz = { type, step: type === 'sens' ? -1 : 0, r: [], axis: 'x', h: '', L: '', res: null, busy: false, err: '' };
  renderWiz();
}
function closeWiz() { wiz = null; $('#sheet').innerHTML = ''; }
function updateWizButton() {
  const b = document.querySelector('#sheet [data-act="wizread"]');
  if (b) b.disabled = !(st.s && st.s.stable) || wiz.busy;
  const g = document.querySelector('#sheet .wizstat');
  if (g) g.innerHTML = wizStat();
}
function wizStat() {
  const s = st.s;
  if (!s) return 'brak danych';
  return (s.stable ? '<span style="color:var(--ok);font-weight:700">GOTOWE</span>' : '<span style="color:var(--warn);font-weight:700">czekaj</span>') +
    ` · X <span class="mono">${fmt(s.x, st.unit)}</span> · Y <span class="mono">${fmt(s.y, st.unit)}</span>`;
}
function renderWiz() {
  if (!wiz) return;
  const steps = wiz.type === 'aba' ? ABA_STEPS : SENS_STEPS;
  const title = wiz.type === 'aba' ? 'Kalibracja zera A-B-A' : 'Kalibracja czułości';
  let body = '';
  if (wiz.step === -1) {
    body = `<div class="sub">Wybierz oś i podaj wymiary. Wałki: h = różnica średnic (np. Ø6 − Ø5) zmierzona mikrometrem.</div>
<div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button data-waxis="x" class="${wiz.axis === 'x' ? 'on' : ''}">Oś X</button><button data-waxis="y" class="${wiz.axis === 'y' ? 'on' : ''}">Oś Y</button></div>
<div class="grid2"><label class="f">h – wysokość podkładki [mm]<input type="number" inputmode="decimal" step="0.001" id="wh" value="${esc(wiz.h)}"></label>
<label class="f">L – rozstaw podparć [mm]<input type="number" inputmode="decimal" step="0.1" id="wl" value="${esc(wiz.L)}"></label></div>
<button class="btn pri" data-act="wizgo">Dalej</button>`;
  } else if (wiz.step < 3) {
    const [lbl, txt] = steps[wiz.step];
    body = `<div class="steps">${[0, 1, 2].map(i => `<span class="${i < wiz.step ? 'done' : i === wiz.step ? 'on' : ''}"></span>`).join('')}</div>
<div style="font-size:18px;font-weight:700">Krok ${wiz.step + 1}/3 · odczyt ${lbl}</div><div style="font-size:15px">${txt}</div>
<div class="card wizstat" style="font-size:14px">${wizStat()}</div>
${wiz.r.map((r, i) => `<div class="sub mono">${steps[i][0]}: X ${fmt(r.x, st.unit)} · Y ${fmt(r.y, st.unit)}</div>`).join('')}
${wiz.err ? `<div class="warnbox">${esc(wiz.err)}</div>` : ''}
<button class="btn pri" data-act="wizread">${wiz.busy ? 'Odczyt…' : 'Zapisz odczyt ' + lbl}</button>`;
  } else {
    const R = wiz.res;
    if (wiz.type === 'aba') {
      const bad = Math.abs(R.drift.x) > 0.010 || Math.abs(R.drift.y) > 0.010;
      body = `<div style="font-size:18px;font-weight:700">Wynik</div>
<div class="card list"><div class="li"><span>Zero czujnika</span><span class="mono">X ${fmt(R.zero.x, st.unit)} · Y ${fmt(R.zero.y, st.unit)}</span></div>
<div class="li"><span>Przechył podłoża</span><span class="mono">X ${fmt(R.tilt.x, st.unit)} · Y ${fmt(R.tilt.y, st.unit)}</span></div>
<div class="li"><span>Dryft A→A</span><span class="mono">X ${fmt(R.drift.x, st.unit)} · Y ${fmt(R.drift.y, st.unit)}</span></div></div>
${bad ? '<div class="warnbox">Dryft ponad 0,010 mm/m – lepiej powtórzyć kalibrację.</div>' : ''}
<button class="btn pri" data-act="wizsave">Zapisz zero w poziomicy</button>`;
    } else {
      body = `<div style="font-size:18px;font-weight:700">Wynik · oś ${wiz.axis.toUpperCase()}</div>
<div class="card list"><div class="li"><span>Oczekiwany przechył</span><span class="mono">${fmt(R.expected, 'mmm', false)} mm/m</span></div>
<div class="li"><span>Zmierzony</span><span class="mono">${fmt(R.measured, 'mmm', false)} mm/m</span></div>
<div class="li"><span>Dryft A→A</span><span class="mono">${fmt(R.drift, 'mmm')} mm/m</span></div>
<div class="li"><span>Nowy współczynnik</span><span class="mono">${num(R.kNew, 5)}</span></div></div>
${R.ok ? '<div class="sub">Po zmianie czułości zrób ponownie kalibrację zera A-B-A.</div>' : '<div class="warnbox">Wynik poza zakresem 0,8–1,2 – sprawdź h, L i ułożenie podkładki.</div>'}
<button class="btn pri" data-act="wizsave" ${R.ok ? '' : 'disabled'}>Zapisz w poziomicy</button>`;
    }
  }
  $('#sheet').innerHTML = `<div class="sheet"><div><div class="row"><div class="h1" style="font-size:19px">${title}</div><button class="btn sm" data-act="wizclose">Zamknij</button></div>${body}</div></div>`;
  updateWizButton();
}
async function wizRead() {
  wiz.busy = true; wiz.err = ''; renderWiz();
  try {
    const r = await reading();
    wiz.r.push(r); wiz.step++;
    if (wiz.step === 3) {
      const [a1, b, a2] = wiz.r;
      wiz.res = wiz.type === 'aba' ? calcABA(a1, b, a2)
        : calcSens(a1, b, a2, wiz.axis, wiz.h, wiz.L, wiz.axis === 'x' ? st.info.kx : st.info.ky);
    }
  } catch (e) { wiz.err = e.message === 'niestabilny' ? 'Odczyt niestabilny – poczekaj na GOTOWE.' : 'Brak odpowiedzi poziomicy.'; }
  wiz.busy = false; renderWiz();
}
async function wizSave() {
  const now = Math.floor(Date.now() / 1000);
  if (wiz.type === 'aba') await send(`Z${wiz.res.zero.x.toFixed(5)},${wiz.res.zero.y.toFixed(5)},${now}\n`);
  else await send(`K${wiz.axis.toUpperCase()},${wiz.res.kNew.toFixed(6)},${now}\n`);
  closeWiz();
}

// ===== obsluga klikniec =====
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button,input');
  if (!t) return;
  const d = t.dataset;
  if (d.tab) { st.tab = d.tab; render(); window.scrollTo(0, 0); return; }
  if (d.axis) { st.axis = d.axis; render(); return; }
  if (d.unit) { st.unit = d.unit; try { localStorage.setItem('poz_unit', d.unit); } catch (e) {} render(); return; }
  if (d.res) { RES = d.res === '0.001' ? 0.001 : 0.005; try { localStorage.setItem('poz_res', String(RES)); } catch (e) {} if (st.connected) send(RES === 0.001 ? 'H' : 'G'); render(); return; }
  if (d.win) { send({ 1: '1', 5: '5', 10: '0', 30: '3' }[d.win]); if (st.s) st.s.win = +d.win; render(); return; }
  if (d.waxis) { wiz.axis = d.waxis; wiz.h = $('#wh').value; wiz.L = $('#wl').value; renderWiz(); return; }
  switch (d.act) {
    case 'connect': connect(); break;
    case 'disconnect': disconnect(); break;
    case 'zero': if (confirm('Wyzerować odczyt w bieżącym położeniu?\n(Dokładniejsze zero: Ustawienia → Kalibracja zera A-B-A)')) send('z'); break;
    case 'point': send('m'); break;
    case 'ret': send('w'); break;
    case 'end': send('k'); break;
    case 'newser': if (confirm('Zacząć nową serię? Bieżące punkty znikną z poziomicy.')) send('n'); break;
    case 'showT': st.showT = t.checked; render(); break;
    case 'csv': { const d0 = new Date(), p = n => String(n).padStart(2, '0');
      saveFile(`seria_${d0.getFullYear()}${p(d0.getMonth() + 1)}${p(d0.getDate())}_${p(d0.getHours())}${p(d0.getMinutes())}.csv`, seriesCsv(analyze(st.points), st.points), 'text/csv'); break; }
    case 'clrzero': if (confirm('Skasować zero?')) { await send('c'); send('i'); } break;
    case 'dl': send('D'); toast('Pobieram plik z karty…'); break;
    case 'dlprev': send('E'); toast('Pobieram poprzedni plik…'); break;
    case 'sound': send('b'); break;
    case 'aba': openWiz('aba'); break;
    case 'sens': if (st.info) openWiz('sens'); else send('i'); break;
    case 'wizclose': closeWiz(); break;
    case 'wizread': wizRead(); break;
    case 'wizsave': wizSave(); break;
    case 'wizgo': {
      wiz.h = $('#wh').value; wiz.L = $('#wl').value;
      const h = parseFloat(String(wiz.h).replace(',', '.')), L = parseFloat(String(wiz.L).replace(',', '.'));
      if (!(h > 0) || !(L > 0) || h >= L) { toast('Podaj poprawne h i L'); break; }
      wiz.h = h; wiz.L = L; wiz.step = 0; renderWiz(); break;
    }
  }
});

render();
</script>
</body>
</html>
