<style>
:root{
  --bg:#0F1215; --card:#1A1F24; --deep:#12161A; --line:#2A3138; --line2:#232A31; --edge:#3A434C;
  --text:#EEF1F3; --soft:#C9D1D8; --muted:#9AA4AD; --faint:#6E7881;
  --accent:#F2C230; --onaccent:#1A1400; --ok:#34D399; --onok:#06281B; --warn:#F59E0B; --bad:#F87171;
  --ycol:#7FB2FF; --tcol:#F0A3FF;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --sans:'IBM Plex Sans',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.38;cursor:default}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px);display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h1{font-size:22px;font-weight:700}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.lab{font-size:13px;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono)}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.band{display:flex;align-items:center;justify-content:space-between;border-radius:14px;padding:12px 16px}
.band .big{font-size:20px;font-weight:700;letter-spacing:1px}
.band small{font-size:12px;text-align:right;line-height:1.35;font-weight:500}
.ready{background:var(--ok);color:var(--onok)}
.wait{background:transparent;color:var(--warn);border:2px solid var(--warn)}
.off{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.val{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.5px}
.btn{height:52px;border-radius:14px;font-size:15px;font-weight:600;background:var(--card);color:var(--text);border:1px solid var(--edge)}
.btn.pri{background:var(--accent);color:var(--onaccent);border:0;font-size:16px;font-weight:700}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.sm{height:40px;padding:0 12px;border-radius:10px;font-size:13px;background:transparent}
.btn.acc{color:var(--accent);border-color:var(--accent)}
.seg{display:grid;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{height:40px;border-radius:9px;border:0;background:transparent;color:var(--soft);font-size:14px}
.seg button.on{background:var(--accent);color:var(--onaccent);font-weight:700}
.list{padding:4px 14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .t{font-size:15px;font-weight:600}
.li .d{font-size:12px;color:var(--muted)}
.tbl{padding:2px 14px;font-size:13px}
.tr{display:grid;grid-template-columns:30px repeat(4,minmax(0,1fr));gap:4px;padding:8px 0;border-bottom:1px solid var(--line2);font-family:var(--mono)}
.tr:last-child{border-bottom:0}
.tr.hd{color:var(--muted);font-size:11px;font-weight:600;font-family:var(--sans);border-bottom:1px solid var(--line)}
.tr .n{font-family:var(--sans);font-weight:600}
.dim{color:var(--muted)}
.badd{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px 0 calc(env(safe-area-inset-bottom) + 10px)}
nav button{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px}
nav button.on{color:var(--accent);font-weight:600}
.cap{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:448px;margin:0 auto;background:#2A3138;color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:30}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.sheet>div>*{flex-shrink:0}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}
.steps span.done{background:var(--ok)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}

.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}

<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>

<script id="core">
// ===== logika serii i formatowanie (bez Bluetooth i ekranu) =====
let DRIFT_LIMIT = 0.010, DIFF_LIMIT = 0.010;   // = polowa tolerancji (setLimits)
function setLimits(v) { DRIFT_LIMIT = DIFF_LIMIT = v; }

function parseP(line) {             // P,nr,t,x,y,temp,stab,kier
  const a = line.split(',');
  if (a.length < 7) return null;
  return { idx: +a[1], t: +a[2], x: +a[3], y: +a[4], temp: +a[5], stab: +a[6], dir: a[7] || 'T' };
}
function parseS(line) {             // S,t,x,y,temp,gotowe,niep,V,okno,powrot,nast,ntam,karta,koniec,spokojne,potrzebne,wstrzas
  const a = line.split(',');
  return { t: +a[1], x: +a[2], y: +a[3], temp: +a[4], stable: a[5] === '1', spread: +a[6], volt: +a[7],
           win: +a[8], ret: a[9] === '1', next: +a[10], nTam: +a[11], sd: +a[12], done: a[13] === '1',
           prog: a.length > 14 ? +a[14] : NaN, need: a.length > 15 ? +a[15] : NaN, shock: a[16] === '1',
           pct: a.length > 17 ? +a[17] : -1, chg: a[18] === '1', rel: a[19] === '1', rssi: a.length > 20 ? +a[20] : 0,
           nsens: a.length > 21 ? +a[21] : 1, mode: +a[22] || 0, store: a.length > 23 ? +a[23] : -1, usb: a[24] === '1' };
}
function parseI(line) {             // I,fw,zx,zy,kx,ky,zt,ktx,kty,dzwiek,karta,plik,okno,krok_um,okno_pkt,filtr
  const a = line.split(',');
  return { res: +a[13] || 5, pw: +a[14] || 10, vib: a[15] === '1',
           rx: +a[16] || 0, ry: +a[17] || 0, relSet: a[18] === '1', relOn: a[19] === '1', lim: +a[20] || 0.01, fw: a[1], zx: +a[2], zy: +a[3], kx: +a[4], ky: +a[5], zt: +a[6], ktx: +a[7], kty: +a[8],
           sound: a[9] === '1', sd: +a[10], file: a[11], win: +a[12],
           mode: +a[21] || 0, nsens: a.length > 22 ? +a[22] : 1, axes: +a[23] || 0, store: a.length > 24 ? +a[24] : (+a[10] ? 2 : 0),
           ssid: a[25] || '', rot: a[26] === '1', timeOk: a[27] === '1', freeKB: +a[28] || 0, rtc: a[29] === '1' };
}

// wynik serii z listy punktow
function analyze(points) {
  const T = [], W = [];
  let E = null;
  for (const p of points) {
    if (p.dir === 'T') T[p.idx] = p; else if (p.dir === 'W') W[p.idx] = p; else if (p.dir === 'E') E = p;
  }
  const nT = T.length;
  const res = { mode: 'open', rows: [], drift: null, maxDiff: null, done: false, ok: null, nT };
  if (!nT || !T[0]) return res;
  const t0 = T[0];
  const hasW = W.some(Boolean);
  const ax = ['x', 'y'];
  if (hasW) {
    res.mode = 'bidir';
    const w0 = W[0];
    res.done = !!w0;
    const drift = w0 ? { x: w0.x - t0.x, y: w0.y - t0.y } : null;
    const span = w0 ? w0.t - t0.t : 0;
    res.drift = drift;
    const maxD = { x: 0, y: 0 };
    for (let i = 0; i < nT; i++) {
      const a = T[i]; if (!a) continue;
      const turn = i === nT - 1;
      const b = W[i] || (turn ? a : null);
      const r = { idx: i, temp: a.temp, tamT: a.t, turn };
      for (const k of ax) {
        r['tam' + k] = a[k] - t0[k];
        r['pow' + k] = b && !turn ? b[k] - t0[k] : null;
        r['sr' + k] = b && w0 ? (a[k] + b[k]) / 2 - (t0[k] + w0[k]) / 2 : null;
        if (b && w0 && !turn) {
          const f = span > 0 ? (b.t - a.t) / span : 0;
          r['r' + k] = (b[k] - a[k]) - f * drift[k];
          maxD[k] = Math.max(maxD[k], Math.abs(r['r' + k]));
        } else r['r' + k] = null;
      }
      if (b && !turn) r.tempW = b.temp;
      res.rows.push(r);
    }
    if (res.done) {
      res.maxDiff = maxD;
      res.ok = Math.abs(drift.x) <= DRIFT_LIMIT && Math.abs(drift.y) <= DRIFT_LIMIT &&
               maxD.x <= DIFF_LIMIT && maxD.y <= DIFF_LIMIT;
    }
    return res;
  }
  res.mode = E ? 'oneway' : 'open';
  res.done = !!E;
  const drift = E ? { x: E.x - t0.x, y: E.y - t0.y } : null;
  const span = E ? E.t - t0.t : 0;
  res.drift = drift;
  for (let i = 0; i < nT; i++) {
    const a = T[i]; if (!a) continue;
    const r = { idx: i, temp: a.temp, tamT: a.t, turn: false };
    const f = E && span > 0 ? (a.t - t0.t) / span : 0;
    for (const k of ax) {
      r['tam' + k] = a[k] - t0[k];
      r['pow' + k] = null;
      r['sr' + k] = E ? (a[k] - t0[k]) - f * drift[k] : null;
      r['r' + k] = null;
    }
    res.rows.push(r);
  }
  if (E) res.ok = Math.abs(drift.x) <= DRIFT_LIMIT && Math.abs(drift.y) <= DRIFT_LIMIT;
  return res;
}

// kalibracja zera A-B-A: A1, B (po obrocie 180 st.), A2 - odczyty {t,x,y}
function calcABA(a1, b, a2) {
  const f = a2.t !== a1.t ? (b.t - a1.t) / (a2.t - a1.t) : 0.5;
  const ai = { x: a1.x + (a2.x - a1.x) * f, y: a1.y + (a2.y - a1.y) * f };
  return {
    zero: { x: (ai.x + b.x) / 2, y: (ai.y + b.y) / 2 },
    tilt: { x: (ai.x - b.x) / 2, y: (ai.y - b.y) / 2 },
    drift: { x: a2.x - a1.x, y: a2.y - a1.y }
  };
}

// kalibracja zera z kilku cykli A-B-A-B-A...: kazde B z odczytami A przed i po nim
function calcABAmulti(r) {
  const cyc = [];
  for (let j = 1; j + 1 < r.length; j += 2) cyc.push(calcABA(r[j - 1], r[j], r[j + 1]));
  if (!cyc.length) return null;
  const n = cyc.length, ax = ['x', 'y'];
  const mean = f => ({ x: cyc.reduce((s, c) => s + f(c).x, 0) / n, y: cyc.reduce((s, c) => s + f(c).y, 0) / n });
  const zero = mean(c => c.zero), tilt = mean(c => c.tilt);
  const sd = {}, u = {}, drift = {};
  for (const k of ax) {
    sd[k] = n > 1 ? Math.sqrt(cyc.reduce((s, c) => s + (c.zero[k] - zero[k]) ** 2, 0) / (n - 1)) : null;
    drift[k] = r[r.length - 1][k] - r[0][k];
    const d1 = Math.max(...cyc.map(c => Math.abs(c.drift[k])));
    // niepewnosc zera: z rozrzutu cykli, a przy jednym cyklu z szumu odczytow i czesci dryftu, ktorej korekta liniowa moze nie usunac
    u[k] = n > 1 ? Math.max(0.002, sd[k] / Math.sqrt(n)) : Math.sqrt(0.0035 ** 2 + (0.25 * d1) ** 2);
  }
  return { n, zero, tilt, sd, u, drift, cycles: cyc };
}

// kalibracja czulosci: h [mm] pod jednym koncem, L [mm] rozstaw podparc
function calcSens(a1, b, a2, axis, h, L, kOld) {
  const f = a2.t !== a1.t ? (b.t - a1.t) / (a2.t - a1.t) : 0.5;
  const ai = a1[axis] + (a2[axis] - a1[axis]) * f;
  const measured = Math.abs(b[axis] - ai);
  const expected = Math.asin(h / L) * 1000;
  const kNew = measured > 0 ? kOld * expected / measured : NaN;
  return { measured, expected, kNew, drift: a2[axis] - a1[axis], ok: kNew > 0.8 && kNew < 1.2 };
}

// jednostki
// krok wyswietlania 0,005 mm/m (= 5 µm/m, ok. 1″) - mniejsze roznice to szum czujnika
const UNITS = { mmm: { f: 1, d: 3, l: 'mm/m' }, umm: { f: 1000, d: 0, l: 'µm/m' }, sec: { f: 206.265, d: 0, l: '″' } };
let RES = 0.005;                    // krok wyswietlania w mm/m: 0,005 albo 0,001
function unitStep(unit) { const u = UNITS[unit] || UNITS.mmm; return unit === 'sec' ? (RES >= 0.005 ? 1 : 0.2) : RES * u.f; }
function unitDec(unit) { return unit === 'sec' ? (RES >= 0.005 ? 0 : 1) : (UNITS[unit] || UNITS.mmm).d; }
// histereza: nowa wartosc dopiero gdy odczyt odejdzie o 0,7 kroku od pokazywanej
const shown = {};
function hyst(key, v) {
  const p = shown[key];
  if (!p || p.res !== RES || Math.abs(v - p.v) > 0.7 * RES) shown[key] = { v: Math.round(v / RES) * RES, res: RES };
  return shown[key].v;
}
function fmt(v, unit, sign = true) {
  if (v === null || v === undefined || isNaN(v)) return '–';
  const u = UNITS[unit] || UNITS.mmm;
  const step = unitStep(unit);
  const r = Math.round(v * u.f / step) * step;
  let s = Math.abs(r).toFixed(unitDec(unit)).replace('.', ',');
  if (!/[1-9]/.test(s)) return s;                  // po zaokragleniu zero: bez znaku
  if (!sign) return (v < 0 ? '−' : '') + s;
  return (v < 0 ? '−' : '+') + s;
}
function niceScale(m, steps) {
  for (const s of steps) if (m <= s) return s;
  return steps[steps.length - 1];
}

// CSV serii
function seriesCsv(res, points) {
  const L = ['# Poziomica - seria (' + (res.mode === 'bidir' ? 'tam i z powrotem' : 'w jedna strone') + '), mm/m'];
  if (res.drift) L.push('# dryft (powrot na start) X ' + res.drift.x.toFixed(4) + ' Y ' + res.drift.y.toFixed(4));
  L.push('nr;tam_x;tam_y;powrot_x;powrot_y;srednia_x;srednia_y;roznica_x;roznica_y;temp_C');
  const n = v => v === null || v === undefined ? '' : v.toFixed(4).replace('.', ',');
  for (const r of res.rows)
    L.push(['P' + r.idx, n(r.tamx), n(r.tamy), n(r.powx), n(r.powy), n(r.srx), n(r.sry), n(r.rx), n(r.ry),
            isNaN(r.temp) ? '' : r.temp.toFixed(2).replace('.', ',')].join(';'));
  L.push('');
  L.push('# surowe punkty: nr;kier;t_s;x;y;temp;niepewnosc');
  for (const p of points) L.push(['P' + p.idx, p.dir, p.t, n(p.x), n(p.y), n(p.temp), n(p.stab)].join(';'));
  return L.join('\r\n') + '\r\n';
}
if (typeof module !== 'undefined') module.exports = { setLimits, calcABAmulti, hyst, setRes: v => { RES = v; }, parseP, parseS, parseI, analyze, calcABA, calcSens, fmt, seriesCsv, niceScale };
</script>

<script>
const APP_VERSION = '05.1';
const SW_CACHE = 'poziomica-' + APP_VERSION;   // ta sama nazwa co w sw.js
// porownanie wersji liczbowo (04.10 jest nowsze niz 04.8)
const fwOld = v => { const a = String(v).split('.').map(Number), b = FW_MIN.split('.').map(Number); return a[0] < b[0] || (a[0] === b[0] && (a[1] || 0) < b[1]); };
const FW_MIN = '05.0';             // wersja programu poziomicy, z ktora ta aplikacja dziala w pelni
// ===== polaczenie: Bluetooth (Bluefy) albo Wi-Fi (strona otwarta z poziomicy, http://192.168.4.1) =====
const WIFI = location.protocol === 'http:' && (location.hostname === '192.168.4.1' || /[?&]ws\b/.test(location.search));
let sock = null;
// ===== Bluetooth (Nordic UART) =====
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

const st = {
  dev: null, rx: null, connected: false, connecting: false,
  s: null, info: null, points: [], tempHist: [],
  tab: 'pomiar', unit: 'mmm', axis: 'x', showT: true,
  buf: '', dl: null, qWait: null, toastTimer: null
};
st.view = 'vial'; st.tol = 0.02; st.div = 'auto'; st.phoneSound = true;
try {
  st.view = localStorage.getItem('poz_view') || 'vial';
  st.tol = parseFloat(localStorage.getItem('poz_tol')) || 0.02;
  st.div = localStorage.getItem('poz_div') || 'auto';
  st.phoneSound = localStorage.getItem('poz_psnd') !== '0';
} catch (e) {}
setLimits(st.tol / 2);
function saveLocal(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

// ===== dzwiek w telefonie (Web Audio; dziala po pierwszym dotknieciu ekranu) =====
let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function phoneBeep(freq = 2200, ms = 120, count = 1) {
  if (!st.phoneSound || !actx) return;
  try {
    let t = actx.currentTime + 0.01;
    for (let i = 0; i < count; i++) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type = 'square';
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
      g.gain.setValueAtTime(0.25, t + ms / 1000 - 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + ms / 1000 + 0.02);
      t += ms / 1000 + 0.09;
    }
  } catch (e) {}
}
try { st.unit = localStorage.getItem('poz_unit') || 'mmm'; RES = localStorage.getItem('poz_res') === '0.001' ? 0.001 : 0.005; } catch (e) {}

let writeChain = Promise.resolve();
function send(cmd) {
  if (WIFI) { try { if (sock && sock.readyState === 1) sock.send(cmd); } catch (e) {} return Promise.resolve(); }
  if (!st.rx) return Promise.resolve();
  const data = new TextEncoder().encode(cmd);
  writeChain = writeChain.then(async () => {
    for (let i = 0; i < data.length; i += 20) await st.rx.writeValue(data.slice(i, i + 20));
  }).catch(e => toast('Błąd wysyłania: ' + e.message));
  return writeChain;
}

async function setupGatt(dev) {
  const server = await dev.gatt.connect();
  const svc = await server.getPrimaryService(NUS);
  st.rx = await svc.getCharacteristic(NUS_RX);
  const tx = await svc.getCharacteristic(NUS_TX);
  tx.addEventListener('characteristicvaluechanged', ev => onData(new TextDecoder().decode(ev.target.value)));
  await tx.startNotifications();
  st.connected = true; st.points = []; st.buf = ''; st.dl = null;
  writeChain = Promise.resolve();
  await afterConnect();
}
// po polaczeniu (oba tryby): czas telefonu, rozdzielczosc, tolerancja, informacje, punkty serii
async function afterConnect() {
  await send(`C${Math.floor(Date.now() / 1000)},${-new Date().getTimezoneOffset()}\n`);
  await send(RES === 0.001 ? 'H' : 'G'); await send(`T${st.tol.toFixed(4)}\n`); await send('i'); st.listing = true; await send('L');
  wakeOn();
}

// ===== Wi-Fi (WebSocket, port 81) =====
function wsConnect() {
  if (sock && sock.readyState <= 1) return;
  st.connecting = !st.reconnecting; render();
  try { sock = new WebSocket(`ws://${location.hostname}:81/`); } catch (e) { sock = null; setTimeout(wsRetry, 2000); return; }
  sock.onopen = () => {
    st.connected = true; st.connecting = false; st.reconnecting = false; st.points = []; st.buf = ''; st.dl = null;
    afterConnect(); render();
  };
  sock.onmessage = ev => { if (typeof ev.data === 'string') onData(ev.data); };
  sock.onclose = () => {
    const was = st.connected;
    sock = null; st.connected = false; st.connecting = false; st.s = null; st.dl = null;
    if (st.qWait) { clearTimeout(st.qWait.timer); st.qWait.reject(new Error('rozlaczono')); st.qWait = null; }
    if (was) st.drops = (st.drops || 0) + 1;
    if (!st.userDisc) { st.reconnecting = true; setTimeout(wsRetry, was ? 300 : 2000); }
    render();
  };
}
function wsRetry() { if (!st.userDisc && !st.connected) wsConnect(); }

async function connect() {
  if (WIFI) { st.userDisc = false; wsConnect(); return; }
  if (!navigator.bluetooth) { toast('Ta przeglądarka nie obsługuje Bluetooth. Otwórz stronę w aplikacji Bluefy.'); return; }
  try {
    st.connecting = true; st.userDisc = false; render();
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ name: 'Poziomica' }, { services: [NUS] }], optionalServices: [NUS] });
    if (st.dev !== dev) dev.addEventListener('gattserverdisconnected', onDisconnect);
    st.dev = dev;
    await setupGatt(dev);
  } catch (e) {
    if (e.name !== 'NotFoundError') toast('Nie udało się połączyć: ' + e.message);
  }
  st.connecting = false; render();
}
function disconnect() {
  st.userDisc = true;
  if (WIFI) { st.reconnecting = false; if (sock) sock.close(); render(); return; }
  if (st.dev && st.dev.gatt.connected) st.dev.gatt.disconnect();
}

// po zerwaniu polaczenia: sama laczy sie ponownie (bez wybierania z listy)
async function onDisconnect() {
  st.connected = false; st.rx = null; st.s = null; st.dl = null;
  if (st.qWait) { clearTimeout(st.qWait.timer); st.qWait.reject(new Error('rozlaczono')); st.qWait = null; }
  st.drops = (st.drops || 0) + 1;
  if (st.userDisc || !st.dev) { render(); toast('Rozłączono z poziomicą'); return; }
  st.reconnecting = true; render();
  // proby bez limitu (co 2 s) - po powrocie w zasieg laczy sie samo; przerywa przycisk Rozlacz
  for (let i = 0; !st.userDisc && !st.connected; i++) {
    await new Promise(r => setTimeout(r, i === 0 ? 300 : 2000));
    try { await setupGatt(st.dev); } catch (e) { /* kolejna proba */ }
  }
  st.reconnecting = false;
  if (!st.connected && !st.userDisc) toast('Nie udało się połączyć ponownie – naciśnij Połącz');
  render();
}

// ekran telefonu nie gasnie, gdy aplikacja jest polaczona
let wakeLock = null;
async function wakeOn() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && st.connected) wakeOn(); });

function onData(chunk) {
  st.buf += chunk;
  for (;;) {
    if (st.dl && !st.dl.http) {
      st.dl.data += st.buf; st.buf = '';
      const ab = st.dl.data.indexOf('\n#ABORT\n');
      if (ab >= 0) {
        st.buf = st.dl.data.slice(ab + 8); st.dl = null;
        toast('Pobieranie przerwane'); render(); renderFiles();
        continue;
      }
      const end = st.dl.data.indexOf('\n#END\n');
      if (end >= 0) {
        const text = st.dl.data.slice(0, end), rest = st.dl.data.slice(end + 6), name = st.dl.name;
        const sec = (Date.now() - st.dl.t0) / 1000;
        if (sec > 2 && text.length > 4000) { dlRate = Math.max(500, text.length / sec); saveLocal(DLKEY, Math.round(dlRate)); }
        const want = st.dl.size;
        st.dl = null; st.buf = rest;
        // kontrola: przez Bluetooth porcje moga zginac - plik musi miec dokladnie tyle bajtow, ile zapowiedziala poziomica
        if (want && text.length !== want) { phoneBeep(900, 70, 2); toast(`Plik niekompletny (${text.length} z ${want} B) – pobierz ponownie`); }
        else saveFile(name, text, 'text/csv');
        render(); renderFiles();
        continue;
      }
      updateDl(); return;
    }
    const i = st.buf.indexOf('\n');
    if (i < 0) return;
    const line = st.buf.slice(0, i).replace(/\r$/, '');
    st.buf = st.buf.slice(i + 1);
    onLine(line);
  }
}

let lastRender = 0;
function onLine(line) {
  if (!line) return;
  const c = line[0];
  if (line.startsWith('S,')) {
    const was = st.s ? st.s.stable : null;
    st.s = parseS(line);
    if (was === false && st.s.stable) phoneBeep(2600, 90);
    st.tempHist.push({ t: Date.now(), T: st.s.temp });
    while (st.tempHist.length && Date.now() - st.tempHist[0].t > 20 * 60000) st.tempHist.shift();
    renderLive();
  } else if (line.startsWith('I,')) {
    st.info = parseI(line);
    if (fwOld(st.info.fw) && !st.fwWarned) { st.fwWarned = true; toast('W poziomicy jest program ' + st.info.fw + ' – wgraj ' + FW_MIN + ', inaczej część funkcji nie zadziała'); }
    render();
  }
  else if (line.startsWith('P,')) {
    const p = parseP(line);
    if (p && !st.points.some(q => q.idx === p.idx && q.dir === p.dir && q.t === p.t)) {
      st.points.push(p);

async function saveFile(name, text, type) {

  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }

  const a = document.createElement('a');

  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function tempTrend() {
  const h = st.tempHist;
  if (h.length < 30) return '';
  const now = h[h.length - 1];
  let ref = h[0];
  for (const p of h) if (now.t - p.t <= 10 * 60000) { ref = p; break; }
  const min = Math.max(1, Math.round((now.t - ref.t) / 60000));
  const d = now.T - ref.T;
  return (d < 0 ? '−' : '+') + num(Math.abs(d), 2) + ' / ' + min + ' min';
}

  const I = st.info, s = st.s, rel = s ? s.rel : I ? I.relOn : false, can = st.connected && I && I.relSet;

function viewPomiar() {
  const s = st.s;

  let main = '', second = '', cap = '';

    if (s.ret) {
      main = `<button class="btn pri" style="flex:2 1 0" data-act="ret" ${s.stable ? '' : 'disabled'}>Zapisz powrót&nbsp; P${s.next}</button>`;
      cap = `tryb powrotu · nawrót w P${s.nTam - 1}`;
    } else if (s.done) {
      main = `<button class="btn pri" style="flex:2 1 0" data-act="point" ${s.stable ? '' : 'disabled'}>Nowa seria: P0</button>`;
      cap = 'seria zakończona · wynik w zakładce Seria';
    } else {
      main = `<button class="btn pri" style="flex:2 1 0" data-act="point" ${s.stable ? '' : 'disabled'}>Zapisz punkt&nbsp; P${s.nTam}</button>`;
      if (s.nTam >= 2) {

      } else if (s.nTam === 0) cap = 'pierwszy punkt to start serii (P0)';
    }

${second}${cap ? `<div class="cap">${cap}</div>` : ''}`;
}

function chart(res) {
  const k = st.axis, rows = res.rows;
  if (!rows.length) return '';
  const vals = [];
  for (const r of rows) { vals.push(r['tam' + k]); if (r['pow' + k] !== null) vals.push(r['pow' + k]); }
  const S = niceScale(Math.max(...vals.map(Math.abs)) * 1.1 || 0.01, [0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50]);
  const x0 = 72, x1 = 308, top = 20, mid = 75, bot = 130;
  const X = i => rows.length > 1 ? x0 + (x1 - x0) * i / (rows.length - 1) : (x0 + x1) / 2;
  const Y = v => mid - v / S * (mid - top);
  let g = `<line x1="50" y1="75" x2="324" y2="75" stroke="#3A434C" stroke-width="1.5"/><line x1="50" y1="20" x2="324" y2="20" stroke="#232A31"/><line x1="50" y1="130" x2="324" y2="130" stroke="#232A31"/>
<text x="46" y="24" fill="#6E7881" font-size="10" text-anchor="end" font-family="IBM Plex Mono">${fmt(S, st.unit)}</text><text x="46" y="79" fill="#6E7881" font-size="10" text-anchor="end" font-family="IBM Plex Mono">0</text><text x="46" y="134" fill="#6E7881" font-size="10" text-anchor="end" font-family="IBM Plex Mono">${fmt(-S, st.unit)}</text>`;
  if (st.showT) {
    const ts = [];
    rows.forEach((r, i) => { if (!isNaN(r.temp)) ts.push([X(i), r.temp]); });
    if (ts.length) {
      // skala temperatury co najmniej 0,5 C na cala wysokosc - drobne wahania nie wygladaja na duze
      const lo0 = Math.min(...ts.map(a => a[1])), hi0 = Math.max(...ts.map(a => a[1]));
      const span = Math.max(hi0 - lo0, 0.5), lo = (lo0 + hi0) / 2 - span / 2;
      const TY = t => bot - (t - lo) / span * (bot - top);
      g += `<polyline points="${ts.map(a => a[0] + ',' + TY(a[1])).join(' ')}" fill="none" stroke="#F0A3FF" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>`;
      g += ts.map(a => `<path d="M${a[0]} ${TY(a[1]) - 5}l5 5-5 5-5-5z" fill="#F0A3FF"/>`).join('');
    }
  }
  g += `<polyline points="${rows.map((r, i) => X(i) + ',' + Y(r['tam' + k])).join(' ')}" fill="none" stroke="#F2C230" stroke-width="2.5"/>`;
  const back = [];
  rows.forEach((r, i) => { if (r.turn) back.push([X(i), Y(r['tam' + k])]); else if (r['pow' + k] !== null) back.push([X(i), Y(r['pow' + k])]); });
  back.sort((a, b) => b[0] - a[0]);
  if (back.length > 1) g += `<polyline points="${back.map(a => a.join(',')).join(' ')}" fill="none" stroke="#F2C230" stroke-width="2" stroke-dasharray="6 4"/>`;
  rows.forEach((r, i) => {
    g += `<circle cx="${X(i)}" cy="${Y(r['tam' + k])}" r="4.5" fill="#F2C230"/>`;
    if (r['pow' + k] !== null) g += `<circle cx="${X(i)}" cy="${Y(r['pow' + k])}" r="4.5" fill="#1A1F24" stroke="#F2C230" stroke-width="2"/>`;
    if (rows.length <= 12 || i % 2 === 0) g += `<text x="${X(i)}" y="147" fill="#9AA4AD" font-size="11" text-anchor="middle" font-family="IBM Plex Mono">P${r.idx}</text>`;
  });
  return `<svg width="100%" viewBox="0 0 330 150" role="img" aria-label="Wykres serii">${g}</svg>`;
}

function viewSeria() {
  const res = analyze(st.points), k = st.axis;
  const title = res.mode === 'bidir' ? 'Seria · tam i z powrotem' : 'Seria';
  const n = res.rows.length;
  const status = !n ? 'brak punktów' : res.done ? 'zakończona' : res.mode === 'bidir' ? 'w toku · powrót' : 'w toku';
  const tile = (l, v, extra = '') => `<div class="card" style="padding:8px 10px;border-radius:14px"><div style="font-size:11px;color:var(--muted);font-weight:600">${l}</div><div class="mono" style="font-size:16px;font-weight:600;${extra}">${v}</div></div>`;
  const ocena = res.ok === null ? tile('Ocena', '–') : res.ok ? tile('Ocena', 'OK', 'color:var(--ok);font-family:var(--sans);font-weight:700') : tile('Ocena', 'Powtórz', 'color:var(--bad);font-family:var(--sans);font-weight:700');
  const temps = res.rows.map(r => r.temp).filter(t => !isNaN(t));
  const tRange = temps.length ? 'T: ' + num(Math.min(...temps), 2) + '–' + num(Math.max(...temps), 2) + ' °C' : '';
  const rows = res.rows.map(r => {
    const bad = r['r' + k] !== null && Math.abs(r['r' + k]) > DIFF_LIMIT;
    return `<div class="tr"><span class="n">P${r.idx}</span><span>${fmt(r['tam' + k], st.unit)}</span>
<span class="${r.turn ? 'dim' : ''}">${r.turn ? 'nawrót' : fmt(r['pow' + k], st.unit)}</span>
<span style="font-weight:600">${fmt(r['sr' + k], st.unit)}</span><span class="${bad ? 'badd' : 'dim'}">${r['r' + k] === null ? '–' : fmt(r['r' + k], st.unit, false)}</span></div>`;
  }).join('');
  return `<div class="row" style="align-items:flex-end"><div><div class="h1">${title}</div><div class="sub">${n ? n + ' pkt · ' : ''}${status} · ${UNITS[st.unit].l}</div></div></div>

 <div class="row"><div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr));width:108px;padding:2px;gap:2px">

   <div style="display:flex;gap:10px;font-size:12px;font-weight:500"><span style="color:var(--accent)">● tam</span><span style="color:var(--accent)">○ powrót</span>${st.showT ? '<span style="color:var(--tcol)">◆ T</span>' : ''}</div></div>
 ${n ? chart(res) : '<div class="sub" style="padding:30px 0;text-align:center">Zapisz punkty na ekranie Pomiar</div>'}
 <div class="row"><label style="display:flex;align-items:center;gap:8px;font-size:14px"><input type="checkbox" data-act="showT" ${st.showT ? 'checked' : ''}> Pokaż temperaturę</label><span class="mono" style="font-size:11px;color:var(--tcol)">${tRange}</span></div>
</div>
${n ? `<div class="card tbl"><div class="tr hd"><span>${k.toUpperCase()}</span><span>tam</span><span>powrót</span><span>średnia</span><span>różnica</span></div>${rows}</div>` : ''}
<div class="row" style="gap:10px"><button class="btn pri" style="flex:1 1 0;height:48px;font-size:15px" data-act="csv" ${n ? '' : 'disabled'}>Eksport CSV</button><button class="btn" style="flex:1 1 0;height:48px" data-act="newser" ${st.connected ? '' : 'disabled'}>Nowa seria</button></div>
<div class="sub" style="font-size:12px">Średnia: wynik po usunięciu dryftu (względem P0). Różnica: tam − powrót po usunięciu dryftu; czerwona = ponad ${num(DIFF_LIMIT, 3)} mm/m (połowa tolerancji).</div>`;
}

function dateStr(t) {
  if (!t) return null;
  const d = new Date(t * 1000);
  return d.toLocaleDateString('pl-PL') + ' ' + d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
}

<div class="card list">
 <div class="li"><div><div class="t">Kalibracja zera A-B-A</div><div class="d">A → obrót 180° (B) → A; zero z korektą dryftu · ${zeroTxt}</div></div><button class="btn sm acc" data-act="aba" ${c ? '' : 'disabled'}>Start</button></div>
 <div class="li"><div><div class="t">Kalibracja czułości</div><div class="d">wałek lub płytka wzorcowa o znanej wysokości · ${kTxt}</div></div><button class="btn sm acc" data-act="sens" ${c ? '' : 'disabled'}>Start</button></div>
 <div class="li"><div><div class="t">Kasuj zero A-B-A</div><div class="d">zero bezwzględne wraca do 0 (zero REL zostaje)</div></div><button class="btn sm" data-act="clrzero" ${c ? '' : 'disabled'}>Kasuj</button></div>
</div>
<div class="card list">
 <div class="li"><div><div class="t">Zapis pomiarów</div><div class="d mono">${esc(sdTxt)}</div></div><div class="row" style="gap:6px"><button class="btn sm acc" data-act="files" ${c && I && I.store ? '' : 'disabled'}>Pliki…</button></div></div>
 <div class="li"><label for="snd" class="t">Sygnał na poziomicy (dioda)</label><input id="snd" type="checkbox" data-act="sound" ${I && I.sound ? 'checked' : ''} ${c ? '' : 'disabled'}></div>
</div>
<div class="sub" style="font-size:12px;text-align:center">aplikacja ${APP_VERSION}${WIFI ? ' · z poziomicy (Wi-Fi)' : offlineOk ? ' · offline ✓' : ''}${I && fwOld(I.fw) ? ` · <span style="color:var(--warn)">program poziomicy ${esc(I.fw)} – wgraj ${FW_MIN}</span>` : ''}</div>
${WIFI || navigator.bluetooth ? '' : '<div class="warnbox">Ta przeglądarka nie obsługuje Bluetooth. Otwórz tę stronę w aplikacji Bluefy – albo przełącz poziomicę na Wi-Fi (przycisk B po włączeniu) i otwórz w Safari http://192.168.4.1</div>'}`;
}

// ===== kreatory kalibracji =====
let wiz = null;
const fineMM = (v, sign = true) => v === null || v === undefined || isNaN(v) ? '–' : (sign ? (v < 0 ? '−' : '+') : (v < 0 ? '−' : '')) + Math.abs(v).toFixed(3).replace('.', ',');
const SENS_TXT = { A: 'Poziomica na płycie bez podkładki.', B: 'Podłóż wałek / płytkę wzorcową pod jeden koniec bazy (wzdłuż wybranej osi).', A2: 'Zdejmij podkładkę, poziomica w tym samym miejscu.' };
function openWiz(type) {
  wiz = { type, phase: type === 'sens' ? 'setup' : 'read', r: [], axis: 'x', h: '', L: '', res: null, busy: false, err: '', auto: true, armed: false, inB: false };
  renderWiz();
}
function closeWiz() { wiz = null; $('#sheet').innerHTML = ''; }
function wizNextLabel() { return wiz.r.length % 2 ? 'B' : 'A'; }
function wizWantsReading() { return wiz.phase === 'read' && (wiz.type === 'aba' || wiz.r.length < 3); }
// automatyczny odczyt: po pierwszym recznym - kiedy poziomica zostanie ruszona (brak GOTOWE) i znowu sie uspokoi
function wizAuto() {
  if (!wiz || !wiz.auto || !wizWantsReading() || wiz.busy || !st.s || wiz.r.length === 0) return;
  if (!st.s.stable) wiz.armed = true;
  else if (wiz.armed) { wiz.armed = false; wizRead(); }
}
function updateWizButton() {
  const b = document.querySelector('#sheet [data-act="wizread"]');
  if (b) b.disabled = !(st.s && st.s.stable) || wiz.busy;
  const g = document.querySelector('#sheet .wizstat');
  if (g) g.innerHTML = wizStat();
  if (wiz && wiz.phase === 'verify') { const v = document.querySelector('#sheet .wizverify'); if (v) v.innerHTML = verifyBody(); }
}
function wizStat() {
  const s = st.s;
  if (!s) return 'brak danych';
  const need = s.need > 0 ? s.need : 8;
  const state = s.stable ? '<span style="color:var(--ok);font-weight:700">GOTOWE</span>'
    : `<span style="color:var(--warn);font-weight:700">${s.shock ? 'wstrząs' : 'stabilizacja ' + Math.min(s.prog || 0, need) + '/' + need + ' s'}</span>`;
  return `${state} · X <span class="mono">${fineMM(s.x)}</span> · Y <span class="mono">${fineMM(s.y)}</span>`;
}
function verifyBody() {
  const R = wiz.res, s = st.s, sg = wiz.inB ? -1 : 1;
  if (!R || !s) return 'brak danych';
  const ex = { x: sg * R.tilt.x, y: sg * R.tilt.y }, dx = s.x - ex.x, dy = s.y - ex.y;
  const ok = Math.abs(dx) <= 0.01 && Math.abs(dy) <= 0.01;
  return `<div class="li"><span>Oczekiwane (${wiz.inB ? 'B' : 'A'})</span><span class="mono">X ${fineMM(ex.x)} · Y ${fineMM(ex.y)}</span></div>
<div class="li"><span>Teraz</span><span class="mono">X ${fineMM(s.x)} · Y ${fineMM(s.y)}</span></div>
<div class="li"><span>Różnica</span><span class="mono" style="color:${ok ? 'var(--ok)' : 'var(--warn)'}">X ${fineMM(dx)} · Y ${fineMM(dy)}</span></div>
<div class="sub" style="font-size:12px">${s.stable ? (ok ? 'Zgodne w granicach ±0,010 mm/m.' : 'Różnica ponad 0,010 – sprawdź ustawienie przy listwie albo powtórz kalibrację.') : 'Poczekaj na GOTOWE.'}</div>`;
}
function abaResultHtml() {
  const R = wiz.res, I = st.info;
  const tiltMax = Math.max(Math.abs(R.tilt.x), Math.abs(R.tilt.y)), uMax = Math.max(R.u.x, R.u.y);
  const haveOld = I && (I.zt || I.zx || I.zy);
  let warn = '';
  if (uMax > 0.010) warn += `<div class="warnbox">Niepewność zera ±${fineMM(uMax, false)} mm/m – ${R.n < 2 ? 'obróć jeszcze raz (dodatkowy cykl) albo powtórz kalibrację' : 'cykle za bardzo się różnią, sprawdź podłoże i ustawienie przy listwie'}.</div>`;
  if (tiltMax > 0.5) warn += `<div class="warnbox">Podłoże pochylone o ${fineMM(tiltMax, false)} mm/m. Gdy obrót nie jest dokładnie o 180°, część pochylenia przechodzi na drugą oś – dosuwaj bazę do listwy / kątownika albo wypoziomuj podłoże.</div>`;
  return `<div style="font-size:18px;font-weight:700">Wynik · ${R.n} ${R.n === 1 ? 'cykl' : R.n < 5 ? 'cykle' : 'cykli'}</div>
<div class="card list">
<div class="li"><span>Zero czujnika</span><span class="mono">X ${fineMM(R.zero.x)} · Y ${fineMM(R.zero.y)}</span></div>
<div class="li"><span>Niepewność zera</span><span class="mono">X ±${fineMM(R.u.x, false)} · Y ±${fineMM(R.u.y, false)}</span></div>
${R.n > 1 ? `<div class="li"><span>Rozrzut cykli</span><span class="mono">X ${fineMM(R.sd.x, false)} · Y ${fineMM(R.sd.y, false)}</span></div>` : ''}
<div class="li"><span>Przechył podłoża</span><span class="mono">X ${fineMM(R.tilt.x)} · Y ${fineMM(R.tilt.y)}</span></div>
<div class="li"><span>Dryft A→A</span><span class="mono">X ${fineMM(R.drift.x)} · Y ${fineMM(R.drift.y)}</span></div>
${haveOld ? `<div class="li"><span>Zmiana wzgl. zapisanego</span><span class="mono">X ${fineMM(R.zero.x - I.zx)} · Y ${fineMM(R.zero.y - I.zy)}</span></div>` : ''}
</div>${warn}
<div class="sub" style="font-size:12px">Kolejny obrót (B, potem A) doda cykl – zero będzie średnią, a niepewność spadnie.</div>
<button class="btn pri" data-act="wizsave">Zapisz zero w poziomicy</button>`;
}
function renderWiz() {
  if (!wiz) return;
  const title = wiz.type === 'aba' ? 'Kalibracja zera A-B-A' : 'Kalibracja czułości';
  let body = '';
  if (wiz.phase === 'setup') {
    body = `<div class="sub">Wybierz oś i podaj wymiary. Wałki: h = różnica średnic (np. Ø6 − Ø5) zmierzona mikrometrem.</div>
<div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button data-waxis="x" class="${wiz.axis === 'x' ? 'on' : ''}">Oś X</button><button data-waxis="y" class="${wiz.axis === 'y' ? 'on' : ''}">Oś Y</button></div>
<div class="grid2"><label class="f">h – wysokość podkładki [mm]<input type="number" inputmode="decimal" step="0.001" id="wh" value="${esc(wiz.h)}"></label>
<label class="f">L – rozstaw podparć [mm]<input type="number" inputmode="decimal" step="0.1" id="wl" value="${esc(wiz.L)}"></label></div>
<button class="btn pri" data-act="wizgo">Dalej</button>`;
  } else if (wiz.phase === 'verify') {
    body = `<div style="font-size:18px;font-weight:700">Sprawdzenie zera</div>
<div class="sub">Postaw poziomicę w pozycji ${wiz.inB ? 'B (obróconej o 180°)' : 'A'}. Odczyt powinien być równy przechyłowi podłoża${wiz.inB ? ' ze zmienionym znakiem' : ''}.</div>
<div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button data-verify="A" class="${wiz.inB ? '' : 'on'}">Jestem w A</button><button data-verify="B" class="${wiz.inB ? 'on' : ''}">Jestem w B</button></div>
<div class="card list wizverify">${verifyBody()}</div>
<button class="btn pri" data-act="wizclose">Zakończ</button>`;
  } else {
    const isAba = wiz.type === 'aba';
    const n = wiz.r.length, lblNext = isAba ? wizNextLabel() : ['A', 'B', 'A'][Math.min(n, 2)];
    const txt = isAba ? (lblNext === 'A' ? (n === 0 ? 'Postaw poziomicę w pozycji A, dosuniętą do listwy albo kątownika.' : 'Obróć z powrotem do pozycji A, do tej samej listwy.') : 'Obróć poziomicę o 180° i dosuń do tej samej listwy.')
      : [SENS_TXT.A, SENS_TXT.B, SENS_TXT.A2][Math.min(n, 2)];
    const done = isAba ? (n >= 3 && n % 2 === 1) : n >= 3;
    const list = wiz.r.map((r, i) => `<div class="sub mono" style="font-size:12px">${isAba ? (i % 2 ? 'B' : 'A') : ['A', 'B', 'A'][i]}${i + 1}: X ${fineMM(r.x)} · Y ${fineMM(r.y)}</div>`).join('');
    const readUi = wizWantsReading() ? `<div style="font-size:17px;font-weight:700">${done ? 'Dodatkowy cykl · ' : ''}odczyt ${lblNext}</div><div style="font-size:15px">${txt}</div>
<div class="card wizstat" style="font-size:14px">${wizStat()}</div>
<label style="display:flex;align-items:center;gap:8px;font-size:14px"><input type="checkbox" data-act="wizauto" ${wiz.auto ? 'checked' : ''}> Automatyczny odczyt po obróceniu i GOTOWE</label>
${wiz.err ? `<div class="warnbox">${esc(wiz.err)}</div>` : ''}
<button class="${done ? 'btn' : 'btn pri'}" data-act="wizread">${wiz.busy ? 'Odczyt…' : 'Zapisz odczyt ' + lblNext + (n === 0 ? '' : ' ręcznie')}</button>` : '';
    let res = '';
    if (done && isAba) res = abaResultHtml();
    else if (done) {
      const R = wiz.res;
      res = `<div style="font-size:18px;font-weight:700">Wynik · oś ${wiz.axis.toUpperCase()}</div>
<div class="card list"><div class="li"><span>Oczekiwany przechył</span><span class="mono">${fineMM(R.expected, false)} mm/m</span></div>
<div class="li"><span>Zmierzony</span><span class="mono">${fineMM(R.measured, false)} mm/m</span></div>
<div class="li"><span>Dryft A→A</span><span class="mono">${fineMM(R.drift)} mm/m</span></div>
<div class="li"><span>Nowy współczynnik</span><span class="mono">${num(R.kNew, 5)}</span></div></div>
${R.ok ? '<div class="sub">Po zmianie czułości zrób ponownie kalibrację zera A-B-A.</div>' : '<div class="warnbox">Wynik poza zakresem 0,8–1,2 – sprawdź h, L i ułożenie podkładki.</div>'}
<button class="btn pri" data-act="wizsave" ${R.ok ? '' : 'disabled'}>Zapisz w poziomicy</button>`;
    }
    body = `${list}${res}${readUi}`;
  }
  $('#sheet').innerHTML = `<div class="sheet"><div><div class="row"><div class="h1" style="font-size:19px">${title}</div><button class="btn sm" data-act="wizclose">Zamknij</button></div>${body}</div></div>`;
  updateWizButton();
}
async function wizRead() {
  wiz.busy = true; wiz.err = ''; renderWiz();
  try {
    const r = await reading();
    wiz.r.push(r);
    if (wiz.type === 'aba') wiz.res = calcABAmulti(wiz.r);
    else if (wiz.r.length === 3) {
      const [a1, b, a2] = wiz.r;
      wiz.res = calcSens(a1, b, a2, wiz.axis, wiz.h, wiz.L, wiz.axis === 'x' ? st.info.kx : st.info.ky);
    }
  } catch (e) { wiz.err = e.message === 'niestabilny' ? 'Odczyt niestabilny – poczekaj na GOTOWE.' : 'Brak odpowiedzi poziomicy.'; }
  wiz.busy = false; wiz.armed = false; renderWiz();
}
async function wizSave() {
  const now = Math.floor(Date.now() / 1000);
  if (wiz.type === 'aba') {
    await send(`Z${wiz.res.zero.x.toFixed(5)},${wiz.res.zero.y.toFixed(5)},${now}\n`);
    wiz.phase = 'verify'; wiz.inB = false; renderWiz();
  } else {
    await send(`K${wiz.axis.toUpperCase()},${wiz.res.kNew.toFixed(6)},${now}\n`);
    closeWiz();
  }
}

// ===== obsluga klikniec =====
document.addEventListener('change', ev => {
  if (ev.target.id !== 'tol') return;
  const v = parseFloat(String(ev.target.value).replace(',', '.'));
  if (v >= 0.004 && v <= 1) { st.tol = v; saveLocal('poz_tol', v); setLimits(v / 2); if (st.connected) send(`T${v.toFixed(4)}\n`); } else toast('Podaj tolerancję od 0,004 do 1, np. 0,020');
  ev.target.blur(); render();
});
document.addEventListener('click', async ev => {
  unlockAudio();
  const t = ev.target.closest('button,input');
  if (!t) return;
  const d = t.dataset;
  if (d.zmode) { send(d.zmode); if (st.s) st.s.rel = d.zmode === 'e'; if (st.info) st.info.relOn = d.zmode === 'e'; render(); return; }
  if (d.view) { st.view = d.view; saveLocal('poz_view', d.view); render(); return; }
  if (d.div) { st.div = d.div; saveLocal('poz_div', d.div); render(); return; }
  if (d.pw) { send(`W${d.pw}\n`); if (st.info) st.info.pw = +d.pw; render(); return; }
  if (d.verify) { wiz.inB = d.verify === 'B'; renderWiz(); return; }
  if (d.lmode !== undefined) {
    const m = +d.lmode; if (!st.info || st.info.mode === m) return;
    const msg = m === 1 ? `Przełączyć poziomicę na Wi-Fi?\nUruchomi się ponownie. Potem połącz telefon z siecią ${st.info.ssid && st.info.ssid.startsWith('Poziomica-') ? st.info.ssid : 'Poziomica-…'} (hasło: poziomica) i otwórz w Safari http://192.168.4.1`
      : 'Przełączyć poziomicę na Bluetooth?\nUruchomi się ponownie. Potem otwórz aplikację w Bluefy i naciśnij Połącz.';
    if (confirm(msg)) { st.userDisc = true; send(`M${m}\n`); }
    return;
  }
  if (d.tab) { st.tab = d.tab; render(); window.scrollTo(0, 0); return; }
  if (d.axis) { st.axis = d.axis; render(); return; }
  if (d.unit) { st.unit = d.unit; try { localStorage.setItem('poz_unit', d.unit); } catch (e) {} render(); return; }
  if (d.res) { RES = d.res === '0.001' ? 0.001 : 0.005; try { localStorage.setItem('poz_res', String(RES)); } catch (e) {} if (st.connected) send(RES === 0.001 ? 'H' : 'G'); render(); return; }
  if (d.win) { send({ 1: '1', 5: '5', 10: '0', 30: '3' }[d.win]); if (st.s) st.s.win = +d.win; render(); return; }
  if (d.waxis) { wiz.axis = d.waxis; wiz.h = $('#wh').value; wiz.L = $('#wl').value; renderWiz(); return; }
  switch (d.act) {
    case 'connect': connect(); break;
    case 'disconnect': disconnect(); break;
    case 'zero': if (confirm('Ustawić zero względne (REL) w bieżącym położeniu?\nZero bezwzględne z kalibracji A-B-A zostaje bez zmian – wrócisz do niego przełącznikiem ABS.')) send('z'); break;
    case 'point': send('m'); break;
    case 'ret': send('w'); break;
    case 'end': send('k'); break;
    case 'newser': if (confirm('Zacząć nową serię? Bieżące punkty znikną z poziomicy.')) send('n'); break;
    case 'showT': st.showT = t.checked; render(); break;
    case 'csv': { const d0 = new Date(), p = n => String(n).padStart(2, '0');
      saveFile(`seria_${d0.getFullYear()}${p(d0.getMonth() + 1)}${p(d0.getDate())}_${p(d0.getHours())}${p(d0.getMinutes())}.csv`, seriesCsv(analyze(st.points), st.points), 'text/csv'); break; }
    case 'clrzero': if (confirm('Skasować zero?')) { await send('c'); send('i'); } break;
    case 'files': openFiles(); break;
    case 'fclose': closeFiles(); break;
    case 'frefresh': if (files && !files.loading) { files.loading = true; files.tmp = []; renderFiles(); send('O'); } break;
    case 'fget': if (!st.dl && d.name) { if (WIFI) httpGet(d.name); else { send('Y' + d.name + '\n'); toast('Pobieram ' + d.name + '…'); } } break;
    case 'fabort': if (st.dl && st.dl.http) st.dl.ctl.abort(); else send('X'); break;
    case 'fdel': if (files) { files.del = d.name; renderFiles(); } break;
    case 'fdelno': if (files) { files.del = null; renderFiles(); } break;
    case 'fdelyes': if (files && d.name) { files.del = null; files.loading = true; files.tmp = []; renderFiles(); send('U' + d.name + '\n'); } break;
    case 'axes': { const b = +d.bit, cur = st.info ? st.info.axes : 0, v = t.checked ? cur | b : cur & ~b; if (st.info) st.info.axes = v; send(`A${v}\n`); toast('Orientacja osi zmieniona – zrób kalibrację zera A-B-A'); break; }
    case 'rot': send('R'); break;
    case 'sound': send('b'); break;
    case 'vib': send(t.checked ? 'F1\n' : 'F0\n'); break;
    case 'psound': st.phoneSound = t.checked; saveLocal('poz_psnd', t.checked ? 1 : 0); if (t.checked) phoneBeep(2200, 120); break;
    case 'wizauto': wiz.auto = t.checked; wiz.armed = false; break;
    case 'aba': openWiz('aba'); break;
    case 'sens': if (st.info) openWiz('sens'); else send('i'); break;
    case 'wizclose': closeWiz(); break;
    case 'wizread': wizRead(); break;
    case 'wizsave': wizSave(); break;
    case 'wizgo': {
      wiz.h = $('#wh').value; wiz.L = $('#wl').value;
      const h = parseFloat(String(wiz.h).replace(',', '.')), L = parseFloat(String(wiz.L).replace(',', '.'));
      if (!(h > 0) || !(L > 0) || h >= L) { toast('Podaj poprawne h i L'); break; }
      wiz.h = h; wiz.L = L; wiz.phase = 'read'; renderWiz(); break;
    }
  }
});

render();
if (WIFI) wsConnect();

// ---------- praca bez internetu ----------
// service worker zapisuje aplikacje w pamieci telefonu; kolejne uruchomienia dzialaja bez internetu
let offlineOk = false;
if (!WIFI && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => caches.has(SW_CACHE))
    .then(ok => { offlineOk = ok; try { render(); } catch (e) {} }).catch(() => {});
}
</script>
</body>
</html>
